<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic Modern Snake</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(15, 23, 42, 0.6);
            --text-color: #f8fafc;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            z-index: 1;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-green);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1.2rem;
            color: #fff;
            transition: color 0.3s;
        }

        .controls-top {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        
        .icon-btn:hover { color: #fff; }
        .icon-btn:active { transform: scale(0.9); }

        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 16px;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .screen-title {
            font-size: 2rem;
            font-weight: 300;
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 4px;
        }

        .btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 10px;
            width: 80%;
            max-width: 260px;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn:hover { background: #059669; box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }
        .btn:active { transform: translateY(2px); }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            box-shadow: none;
        }
        
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        .selector-group {
            margin-bottom: 25px;
            width: 85%;
            max-width: 300px;
        }

        .selector-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
            display: block;
        }

        .selector-options {
            display: flex;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .selector-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 0;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .selector-btn.active {
            background: #334155;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .score-anim {
            animation: scorePop 0.3s ease-out;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: var(--accent-green); }
            100% { transform: scale(1); }
        }

        @media (min-width: 768px) {
            #game-container { padding: 30px; max-width: 600px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <div>
                <div class="title">Snake</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Score</span>
                        <span class="stat-value" id="score-display">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Best</span>
                        <span class="stat-value" id="highscore-display">0</span>
                    </div>
                </div>
            </div>
            <div class="controls-top">
                <button class="icon-btn" id="sound-toggle" title="Toggle Sound">🔊</button>
                <button class="icon-btn" id="pause-toggle" title="Pause Game">⏸</button>
            </div>
        </header>

        <div class="board-wrapper">
            <canvas id="gameCanvas"></canvas>

            <div id="start-screen" class="overlay-screen active">
                <div class="screen-title">SNAKE</div>
                
                <div class="selector-group">
                    <span class="selector-label">Difficulty</span>
                    <div class="selector-options">
                        <!-- Easy is now selected by default -->
                        <button class="selector-btn active" data-group="difficulty" data-val="easy">Easy</button>
                        <button class="selector-btn" data-group="difficulty" data-val="medium">Medium</button>
                        <button class="selector-btn" data-group="difficulty" data-val="hard">Hard</button>
                    </div>
                </div>

                <button class="btn" id="start-btn">PLAY</button>
            </div>

            <div id="pause-screen" class="overlay-screen">
                <div class="screen-title" style="font-size: 1.5rem;">PAUSED</div>
                <button class="btn" id="resume-btn">Resume</button>
                <button class="btn btn-outline" id="restart-btn">Restart</button>
            </div>

            <div id="gameover-screen" class="overlay-screen">
                <div class="screen-title" style="font-size: 1.8rem; color: var(--accent-red);">GAME OVER</div>
                <div class="stat-box" style="align-items: center; margin-bottom: 30px;">
                    <span class="stat-label">Final Score</span>
                    <span class="stat-value" id="final-score" style="font-size: 3rem;">0</span>
                </div>
                <button class="btn" id="play-again-btn">Play Again</button>
                <button class="btn btn-outline" id="home-btn">Main Menu</button>
            </div>

            <div id="countdown-screen" class="overlay-screen">
                <div class="screen-title" id="countdown-text" style="font-size: 6rem; font-weight: 600;">3</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const screens = {
            start: document.getElementById('start-screen'),
            pause: document.getElementById('pause-screen'),
            gameover: document.getElementById('gameover-screen'),
            countdown: document.getElementById('countdown-screen')
        };
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('highscore-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const soundToggle = document.getElementById('sound-toggle');

        // Game Settings & State
        let gridSize = 0;
        let tileCount = 18;
        let snake = [];
        let dx = 0, dy = 0;
        let nextDx = 0, nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScoreEndless') || 0;
        let state = 'START'; 
        
        // Difficulty and speed settings
        let difficulty = 'easy'; // Easy is default
        // Lower number means faster speed (time in milliseconds between moves)
        const difficultySpeeds = { 
            easy: 220,    // Slow
            medium: 130,  // Medium
            hard: 75      // Fast
        };
        
        let lastTime = 0;
        let moveAccumulator = 0;
        let currentSpeed = difficultySpeeds[difficulty];
        let animationId;

        // Food & Diamond State
        let currentFood = null;
        let fruitsEatenCounter = 0;
        let targetFruitsForDiamond = 0; 

        let soundEnabled = true;
        let audioCtx = null;

        highScoreDisplay.textContent = highScore;

        // Fruit Definitions
        const fruitTypes = [
            { id: 'apple', score: 10, color: '#ef4444' },
            { id: 'banana', score: 15, color: '#facc15' },
            { id: 'orange', score: 20, color: '#f97316' },
            { id: 'grapes', score: 25, color: '#a855f7' }
        ];

        document.querySelectorAll('.selector-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const group = e.target.dataset.group;
                const val = e.target.dataset.val;
                document.querySelectorAll(`.selector-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                if (group === 'difficulty') difficulty = val;
                playSound('click');
            });
        });

        function resizeCanvas() {
            const wrapper = document.querySelector('.board-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            gridSize = canvas.width / tileCount;
            if(state === 'PLAYING' || state === 'PAUSED' || state === 'START') draw();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initGame() {
            snake = [
                {x: Math.floor(tileCount/2), y: Math.floor(tileCount/2)},
                {x: Math.floor(tileCount/2), y: Math.floor(tileCount/2) + 1},
                {x: Math.floor(tileCount/2), y: Math.floor(tileCount/2) + 2},
                {x: Math.floor(tileCount/2), y: Math.floor(tileCount/2) + 3}
            ];
            dx = 0; dy = -1; nextDx = 0; nextDy = -1;
            score = 0;
            fruitsEatenCounter = 0;
            setNextDiamondTarget();
            currentSpeed = difficultySpeeds[difficulty];
            updateScoreDisplay(false);
            spawnFood();
        }

        function setNextDiamondTarget() {
            // Random number between 4 and 9
            targetFruitsForDiamond = Math.floor(Math.random() * 6) + 4;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;

                if (type === 'eat') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'diamond') {
                    const freqs = [1046.50, 1318.51, 1567.98, 2093.00]; // C6, E6, G6, C7
                    freqs.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        const startTime = now + (i * 0.05);
                        gain.gain.setValueAtTime(0, now);
                        gain.gain.setValueAtTime(0.15, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
                        osc.start(startTime);
                        osc.stop(startTime + 0.5);
                    });
                } else if (type === 'die') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now); osc.stop(now + 0.05);
                }
            } catch(e) {}
        }

        function spawnFood() {
            let valid = false;
            let nx, ny;
            while (!valid) {
                nx = Math.floor(Math.random() * tileCount);
                ny = Math.floor(Math.random() * tileCount);
                valid = true;
                for (let part of snake) {
                    if (part.x === nx && part.y === ny) { valid = false; break; }
                }
            }

            if (fruitsEatenCounter >= targetFruitsForDiamond) {
                currentFood = { type: 'diamond', x: nx, y: ny, score: 50 };
                fruitsEatenCounter = 0; 
                setNextDiamondTarget();
            } else {
                const randomFruit = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
                currentFood = { type: randomFruit.id, x: nx, y: ny, score: randomFruit.score };
            }
        }

        function updateScoreDisplay(animate = true) {
            scoreDisplay.textContent = score;
            if (animate) {
                scoreDisplay.classList.remove('score-anim');
                void scoreDisplay.offsetWidth; 
                scoreDisplay.classList.add('score-anim');
            }
            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('snakeHighScoreEndless', highScore);
            }
        }

        function drawFood() {
            if (!currentFood) return;
            const cx = currentFood.x * gridSize + gridSize/2;
            const cy = currentFood.y * gridSize + gridSize/2;
            const r = gridSize/2.2;

            ctx.save();
            ctx.translate(cx, cy);

            if (currentFood.type === 'diamond') {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#06b6d4';
                ctx.fillStyle = '#22d3ee';
                ctx.beginPath();
                ctx.moveTo(0, -r);
                ctx.lineTo(r, 0);
                ctx.lineTo(0, r);
                ctx.lineTo(-r, 0);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#cffafe';
                ctx.beginPath();
                ctx.moveTo(0, -r*0.6);
                ctx.lineTo(r*0.6, 0);
                ctx.lineTo(0, r*0.6);
                ctx.lineTo(-r*0.6, 0);
                ctx.closePath();
                ctx.fill();

            } else if (currentFood.type === 'apple') {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(239, 68, 68, 0.4)';
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(-r*0.3, -r*0.3, r*0.25, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.ellipse(r*0.2, -r*0.8, r*0.4, r*0.2, -Math.PI/4, 0, Math.PI*2);
                ctx.fill();
            } else if (currentFood.type === 'banana') {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(250, 204, 21, 0.4)';
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(-r*0.2, 0, r*0.9, Math.PI*-0.3, Math.PI*1.3, false);
                ctx.arc(0, 0, r*0.7, Math.PI*1.2, Math.PI*-0.2, true);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#654321';
                ctx.fillRect(r*0.5, -r*0.9, r*0.2, r*0.3);
            } else if (currentFood.type === 'orange') {
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(249, 115, 22, 0.4)';
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for(let i=0; i<4; i++){
                    ctx.beginPath();
                    ctx.arc((Math.random()-0.5)*r, (Math.random()-0.5)*r, r*0.08, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(0, -r*0.9, r*0.15, 0, Math.PI*2);
                ctx.fill();
            } else if (currentFood.type === 'grapes') {
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(168, 85, 247, 0.4)';
                ctx.fillStyle = '#a855f7';
                const offsets = [
                    {x: 0, y: -r*0.3}, {x: -r*0.4, y: 0}, {x: r*0.4, y: 0}, 
                    {x: -r*0.2, y: r*0.4}, {x: r*0.2, y: r*0.4}, {x: 0, y: r*0.7}
                ];
                offsets.forEach(pos => {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, r*0.35, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.fillStyle = '#16a34a';
                ctx.fillRect(-r*0.05, -r*0.8, r*0.1, r*0.4);
            }
            ctx.restore();
        }

        function drawRealisticSnake() {
            if (snake.length === 0) return;

            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 4;

            for (let i = snake.length - 1; i >= 0; i--) {
                const seg = snake[i];
                const cx = seg.x * gridSize + gridSize/2;
                const cy = seg.y * gridSize + gridSize/2;
                
                const progress = i / snake.length; 
                const maxRadius = gridSize / 1.4; 
                const radius = maxRadius * (1 - (progress * 0.65)); 
                
                if (i > 0) {
                    const next = snake[i-1];
                    if (Math.abs(seg.x - next.x) <= 1 && Math.abs(seg.y - next.y) <= 1) {
                        const nx = next.x * gridSize + gridSize/2;
                        const ny = next.y * gridSize + gridSize/2;
                        
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(nx, ny);
                        ctx.lineWidth = radius * 2; 
                        ctx.lineCap = 'round';
                        ctx.strokeStyle = '#15803d'; 
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(nx, ny);
                        ctx.lineWidth = radius * 1.2;
                        ctx.strokeStyle = '#22c55e'; 
                        ctx.stroke();
                    }
                }

                if (i === 0) {
                    ctx.shadowColor = 'transparent'; 
                    
                    const hr = gridSize / 1.4;
                    let angle = 0;
                    if (dx === 1) angle = 0;
                    else if (dx === -1) angle = Math.PI;
                    else if (dy === 1) angle = Math.PI/2;
                    else if (dy === -1) angle = -Math.PI/2;
                    else angle = -Math.PI/2; 

                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(angle);

                    ctx.fillStyle = '#14532d'; 
                    ctx.beginPath();
                    ctx.ellipse(0, 0, hr*1.1, hr*0.9, 0, 0, Math.PI*2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#16a34a'; 
                    ctx.beginPath();
                    ctx.ellipse(0, 0, hr, hr*0.8, 0, 0, Math.PI*2);
                    ctx.fill();

                    const eyeDistX = hr * 0.35;
                    const eyeDistY = hr * 0.55;
                    const eyeR = hr * 0.3;
                    
                    ctx.fillStyle = '#fef08a'; 
                    ctx.beginPath();
                    ctx.arc(eyeDistX, -eyeDistY, eyeR, 0, Math.PI*2);
                    ctx.arc(eyeDistX, eyeDistY, eyeR, 0, Math.PI*2);
                    ctx.fill();

                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.ellipse(eyeDistX, -eyeDistY, eyeR*0.2, eyeR*0.8, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(eyeDistX, eyeDistY, eyeR*0.2, eyeR*0.8, 0, 0, Math.PI*2);
                    ctx.fill();

                    ctx.restore();
                }
            }
            ctx.shadowColor = 'transparent'; 
        }

        function gameOver() {
            state = 'GAMEOVER';
            playSound('die');
            finalScoreDisplay.textContent = score;
            showScreen('gameover');
        }

        function update() {
            dx = nextDx;
            dy = nextDy;
            
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Endless mode walls wrap
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return gameOver();
            }

            snake.unshift(head);

            if (head.x === currentFood.x && head.y === currentFood.y) {
                score += currentFood.score;
                
                if (currentFood.type === 'diamond') {
                    playSound('diamond');
                } else {
                    playSound('eat');
                    fruitsEatenCounter++;
                }
                
                updateScoreDisplay(true);
                // Slight speed up, capped so it doesn't get ridiculously fast
                currentSpeed = Math.max(50, difficultySpeeds[difficulty] - Math.floor(score / 150) * 5);
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for (let r=0; r<tileCount; r++) {
                for (let c=0; c<tileCount; c++) {
                    if ((r+c)%2 === 0) {
                        ctx.fillRect(c*gridSize, r*gridSize, gridSize, gridSize);
                    }
                }
            }

            drawFood();
            drawRealisticSnake();
        }

        function gameLoop(timestamp) {
            if (state !== 'PLAYING') {
                lastTime = timestamp;
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            let deltaTime = timestamp - lastTime;
            if (deltaTime > 200) deltaTime = currentSpeed; 
            
            lastTime = timestamp;
            moveAccumulator += deltaTime;

            if (moveAccumulator >= currentSpeed) {
                update();
                moveAccumulator = 0; 
            }

            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            if (screenName && screens[screenName]) {
                screens[screenName].classList.add('active');
            }
        }

        function startCountdown() {
            state = 'COUNTDOWN';
            showScreen('countdown');
            let count = 3;
            const text = document.getElementById('countdown-text');
            text.textContent = count;
            playSound('click');

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    text.textContent = count;
                    playSound('click');
                } else {
                    clearInterval(interval);
                    showScreen(null);
                    state = 'PLAYING';
                    lastTime = performance.now();
                }
            }, 600);
        }

        function startGame() {
            initGame();
            draw();
            startCountdown();
            if (!animationId) animationId = requestAnimationFrame(gameLoop);
        }

        function handleInput(newDx, newDy) {
            if (state !== 'PLAYING') return;
            if (newDx !== 0 && dx !== 0) return;
            if (newDy !== 0 && dy !== 0) return;
            nextDx = newDx;
            nextDy = newDy;
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowUp' || e.key === 'w') handleInput(0, -1);
            else if (e.key === 'ArrowDown' || e.key === 's') handleInput(0, 1);
            else if (e.key === 'ArrowLeft' || e.key === 'a') handleInput(-1, 0);
            else if (e.key === 'ArrowRight' || e.key === 'd') handleInput(1, 0);
        });

        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            if(e.target === canvas) e.preventDefault();
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        canvas.addEventListener('touchend', (e) => {
            if(e.target === canvas) e.preventDefault();
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) handleInput(1, 0); else handleInput(-1, 0);
                } else {
                    if (diffY > 0) handleInput(0, 1); else handleInput(0, -1);
                }
            }
        }, {passive: false});

        document.getElementById('start-btn').addEventListener('click', () => { playSound('click'); startGame(); });
        
        document.getElementById('pause-toggle').addEventListener('click', () => {
            playSound('click');
            if (state === 'PLAYING') {
                state = 'PAUSED';
                showScreen('pause');
            } else if (state === 'PAUSED') {
                state = 'PLAYING';
                showScreen(null);
                lastTime = performance.now();
            }
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            playSound('click');
            state = 'PLAYING';
            showScreen(null);
            lastTime = performance.now();
        });

        document.getElementById('restart-btn').addEventListener('click', () => { playSound('click'); startGame(); });
        document.getElementById('play-again-btn').addEventListener('click', () => { playSound('click'); startGame(); });
        document.getElementById('home-btn').addEventListener('click', () => {
            playSound('click');
            state = 'START';
            showScreen('start');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
            soundToggle.style.color = soundEnabled ? '#fff' : '#64748b';
            if (soundEnabled) playSound('click');
        });

        draw();
    </script>
</body>
</html>
