<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Puzzle Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #0f172a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #3b0764, #1e1b4b, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            margin: 0;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .screen {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 2rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center; /* Better centering to avoid empty space */
            gap: 1.25rem;
        }

        .scrollable-content {
            overflow-y: auto;
            flex: 1;
            padding-right: 0.5rem;
            margin-right: -0.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .scrollable-content::-webkit-scrollbar { width: 4px; }
        .scrollable-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 1.25rem;
            padding: 1rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: white;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            min-height: 56px;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 6px -2px rgba(99, 102, 241, 0.4);
        }

        .btn-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4); }
        .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.4); }
        .btn-gray { background: linear-gradient(135deg, #4b5563, #374151); box-shadow: 0 10px 15px -3px rgba(75, 85, 99, 0.4); }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            width: 100%;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.25rem;
            padding: 1rem 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            transition: all 0.15s ease-out;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 75px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .option-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.2); }

        .option-btn.correct { 
            background: linear-gradient(135deg, #10b981, #059669); 
            border-color: #34d399; 
            box-shadow: 0 0 20px rgba(16,185,129,0.5);
            transform: scale(1.05); 
            z-index: 10;
        }
        
        .option-btn.wrong { 
            background: linear-gradient(135deg, #ef4444, #dc2626); 
            border-color: #f87171; 
            animation: shake 0.4s; 
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        .selection-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }

        .toggle-btn { 
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 1rem; 
            padding: 0.75rem 0.5rem; font-weight: 600; text-align: center; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; font-size: 0.9rem; min-height: 65px;
        }
        .toggle-btn.selected { 
            background: rgba(99, 102, 241, 0.3); border-color: #a5b4fc; box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.5); color: white; transform: scale(1.02);
        }

        .progress-container { width: 100%; height: 12px; background: rgba(0,0,0,0.4); border-radius: 6px; overflow: hidden; margin: 0.5rem 0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #34d399, #10b981); width: 100%; transition: width 1s linear, background-color 0.3s; border-radius: 6px; }

        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        
        .dynamic-text { font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.1; word-wrap: break-word; }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <div class="glass-panel items-center max-h-[550px] !gap-8">
            <div class="text-center floating">
                <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-300 via-purple-300 to-pink-300 drop-shadow-sm tracking-tight">MATH</h1>
                <h2 class="text-4xl font-extrabold tracking-widest text-white drop-shadow-md">PUZZLE</h2>
            </div>
            
            <div class="flex flex-col gap-3 w-full">
                <button class="btn" onclick="nav('screen-modes')">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                    PLAY NOW
                </button>
                <button class="btn btn-gray" onclick="nav('screen-settings')">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
                    SETTINGS
                </button>
            </div>
            
            <div class="text-center w-full bg-black/30 rounded-2xl p-3 border border-white/10">
                <p class="text-indigo-200 text-[10px] font-bold uppercase tracking-widest mb-1">High Score</p>
                <p id="home-high-score" class="text-3xl font-black text-yellow-400 drop-shadow-md">0</p>
            </div>
        </div>
    </div>

    <div id="screen-modes" class="screen">
        <div class="glass-panel w-full max-h-[700px] !gap-4">
            <h2 class="text-xl font-extrabold text-center text-white">Select Mode</h2>
            
            <div class="selection-grid" id="mode-selector">
                <div class="toggle-btn selected" data-mode="quick"><span class="text-xl">⚡</span><span>Quick Math</span></div>
                <div class="toggle-btn" data-mode="missing"><span class="text-xl">❓</span><span>Missing No.</span></div>
                <div class="toggle-btn" data-mode="pattern"><span class="text-xl">📈</span><span>Pattern</span></div>
                <div class="toggle-btn" data-mode="equation"><span class="text-xl">🧮</span><span>Equation</span></div>
                <div class="toggle-btn" data-mode="odd"><span class="text-xl">🎯</span><span>Odd One Out</span></div>
                <div class="toggle-btn" data-mode="brain"><span class="text-xl">🧠</span><span>Brain Test</span></div>
            </div>

            <h3 class="text-[11px] font-bold text-center text-indigo-300 uppercase tracking-widest">Select Difficulty</h3>
            <div class="diff-grid" id="diff-selector">
                <div class="toggle-btn selected !min-h-[45px] !text-sm" data-diff="easy">Easy</div>
                <div class="toggle-btn !min-h-[45px] !text-sm" data-diff="med">Medium</div>
                <div class="toggle-btn !min-h-[45px] !text-sm" data-diff="hard">Hard</div>
            </div>

            <div class="flex gap-2 w-full mt-2">
                <button class="btn btn-gray flex-[0.35] !px-2 !text-base" onclick="nav('screen-home')">Back</button>
                <button class="btn btn-green flex-[0.65]" onclick="startGame()">START</button>
            </div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="glass-panel w-full h-full max-h-[800px] !p-4 !gap-4 flex flex-col justify-start">
            <div class="flex justify-between items-center bg-black/20 rounded-xl p-3 border border-white/10 shadow-inner">
                <div class="flex flex-col">
                    <span class="text-[9px] text-indigo-300 font-bold uppercase tracking-widest">Score</span>
                    <span id="game-score" class="text-xl font-black text-yellow-400 leading-none mt-1">0</span>
                </div>
                <div class="text-center">
                    <span id="game-streak" class="text-xs font-bold text-orange-400 bg-orange-900/30 px-3 py-1 rounded-full border border-orange-500/30 whitespace-nowrap">🔥 0</span>
                </div>
                <div class="flex gap-2">
                    <button class="w-9 h-9 rounded-full bg-indigo-500/20 active:bg-indigo-500/40 border border-indigo-400/30 flex items-center justify-center text-base" onclick="showHint()">💡</button>
                    <button class="w-9 h-9 rounded-full bg-white/10 active:bg-white/20 border border-white/20 flex items-center justify-center text-base" onclick="pauseGame()">⏸</button>
                </div>
            </div>

            <div class="progress-container">
                <div id="timer-bar" class="progress-bar"></div>
            </div>
            <div class="text-center">
                <span id="game-mode-label" class="text-[9px] font-bold text-white/50 uppercase tracking-widest">QUICK MATH</span>
            </div>
            
            <!-- Grouping Question and Options to fix vertical spacing -->
            <div class="flex-1 flex flex-col items-center justify-center w-full gap-8">
                <div class="relative w-full flex justify-center">
                    <h2 id="question-text" class="dynamic-text font-black text-center drop-shadow-xl px-2"></h2>
                    <div id="hint-text" class="absolute -bottom-8 text-xs font-bold text-yellow-300 bg-black/40 px-3 py-1.5 rounded-lg hidden border border-yellow-500/30 whitespace-nowrap z-10"></div>
                </div>

                <div class="options-grid" id="options-container"></div>
            </div>
        </div>
    </div>

    <div id="screen-pause" class="screen" style="background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 50;">
        <div class="glass-panel w-full max-w-[300px] text-center !gap-6">
            <h2 class="text-3xl font-black text-white tracking-widest">PAUSED</h2>
            <div class="flex flex-col gap-3 w-full">
                <button class="btn btn-green" onclick="resumeGame()">RESUME</button>
                <button class="btn btn-gray !text-base" onclick="toggleSoundFromPause()" id="pause-sound-btn">SOUND: ON</button>
                <button class="btn btn-red !text-base" onclick="endGame()">END GAME</button>
            </div>
        </div>
    </div>

    <div id="screen-results" class="screen">
        <div class="glass-panel w-full text-center max-h-[600px] !gap-6">
            <div>
                <h2 class="text-3xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400 uppercase tracking-wide" id="result-title">Game Over</h2>
                <p class="text-indigo-200 text-xs font-semibold" id="result-subtitle">Time ran out!</p>
            </div>
            
            <div class="bg-black/30 rounded-2xl p-5 border border-white/10 shadow-inner">
                <p class="text-indigo-300 uppercase font-black tracking-widest text-[9px] mb-1">Final Score</p>
                <p id="result-score" class="text-6xl font-black text-yellow-400 drop-shadow-lg mb-4 leading-none">0</p>
                
                <div class="flex justify-between border-t border-white/10 pt-3 px-2">
                    <div class="text-left">
                        <p class="text-[9px] text-indigo-300 uppercase font-bold tracking-wider">Correct</p>
                        <p id="result-correct" class="text-lg font-black text-white">0</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] text-indigo-300 uppercase font-bold tracking-wider">Best Score</p>
                        <p id="result-best" class="text-lg font-black text-green-400">0</p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-2 w-full">
                <button class="btn btn-green" onclick="startGame()">PLAY AGAIN</button>
                <button class="btn btn-gray" onclick="nav('screen-home')">MAIN MENU</button>
            </div>
        </div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="glass-panel w-full max-h-[500px] !gap-6">
            <h2 class="text-2xl font-black text-center tracking-wide">SETTINGS</h2>
            
            <div class="flex flex-col gap-4 w-full">
                <div class="flex justify-between items-center bg-black/20 p-4 rounded-xl border border-white/10 active:bg-black/30 transition-colors" onclick="toggleSound()">
                    <div class="flex items-center gap-3"><span class="text-xl">🎵</span><span class="text-base font-bold">Sound Effects</span></div>
                    <div id="sound-indicator" class="text-xs font-black text-green-400 bg-green-900/30 px-2 py-1 rounded-md border border-green-500/30">ON</div>
                </div>
                <button class="btn btn-red" id="reset-btn" onclick="clearData()">RESET PROGRESS</button>
            </div>
            
            <button class="btn btn-gray w-full" onclick="nav('screen-home')">BACK</button>
        </div>
    </div>

    <script>
        let state = {
            mode: 'quick', difficulty: 'easy', score: 0, streak: 0, correctCount: 0,
            timeLeft: 60, maxTime: 60, timer: null, isPaused: false, currentQ: null,
            highScore: parseInt(localStorage.getItem('mathMobileHigh')) || 0,
            soundEnabled: localStorage.getItem('mathMobileSound') !== 'false'
        };

        document.getElementById('home-high-score').innerText = state.highScore;
        updateSoundUI();

        const AudioSys = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playTone(freq, type, duration, vol=0.1) {
                if (!state.soundEnabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            },
            click() { this.playTone(600, 'sine', 0.1, 0.05); },
            correct() { this.playTone(880, 'sine', 0.1, 0.1); setTimeout(()=>this.playTone(1108, 'sine', 0.15, 0.1), 100); },
            wrong() { this.playTone(250, 'sawtooth', 0.3, 0.15); },
            over() { this.playTone(150, 'square', 0.5, 0.2); }
        };

        function nav(screenId) {
            AudioSys.click();
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            localStorage.setItem('mathMobileSound', state.soundEnabled);
            updateSoundUI();
            if (state.soundEnabled) AudioSys.click();
        }

        function toggleSoundFromPause() {
            toggleSound();
            document.getElementById('pause-sound-btn').innerText = state.soundEnabled ? 'SOUND: ON' : 'SOUND: OFF';
        }
        
        function updateSoundUI() {
            const ind = document.getElementById('sound-indicator');
            ind.innerText = state.soundEnabled ? 'ON' : 'OFF';
            ind.className = state.soundEnabled ? 'text-xs font-black text-green-400 bg-green-900/30 px-2 py-1 rounded-md border border-green-500/30' : 'text-xs font-black text-gray-400 bg-gray-900/30 px-2 py-1 rounded-md border border-gray-500/30';
        }
        
        function clearData() {
            AudioSys.click();
            localStorage.removeItem('mathMobileHigh');
            state.highScore = 0;
            document.getElementById('home-high-score').innerText = 0;
            const btn = document.getElementById('reset-btn');
            const originalText = btn.innerText;
            btn.innerText = "CLEARED!";
            btn.classList.replace('btn-red', 'btn-green');
            setTimeout(() => { btn.innerText = originalText; btn.classList.replace('btn-green', 'btn-red'); }, 2000);
        }

        document.querySelectorAll('#mode-selector .toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                AudioSys.click();
                document.querySelectorAll('#mode-selector .toggle-btn').forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                state.mode = e.currentTarget.dataset.mode;
            });
        });

        document.querySelectorAll('#diff-selector .toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                AudioSys.click();
                document.querySelectorAll('#diff-selector .toggle-btn').forEach(b => b.classList.remove('selected'));
                e.currentTarget.classList.add('selected');
                state.difficulty = e.currentTarget.dataset.diff;
            });
        });

        const MathGen = {
            rand: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
            shuffle: (arr) => arr.sort(() => Math.random() - 0.5),
            getDistractors: (ans, count=3, range=5) => {
                let options = new Set([ans]); let loopCount = 0;
                while(options.size < count + 1 && loopCount < 50) {
                    let offset = MathGen.rand(-range, range);
                    if (offset === 0) offset = 1;
                    let fake = ans + offset;
                    if (ans >= 0 && fake < 0) fake = Math.abs(fake); 
                    options.add(fake); loopCount++;
                }
                return MathGen.shuffle(Array.from(options));
            },
            generate(mode, diff) {
                const rangeMax = diff === 'easy' ? 12 : (diff === 'med' ? 30 : 75);
                let q = { text: '', hint: '', answer: 0, options: [] };
                let a, b, c;
                let currentMode = mode === 'brain' ? ['quick', 'missing', 'pattern', 'equation', 'odd'][MathGen.rand(0, 4)] : mode;

                switch(currentMode) {
                    case 'quick':
                        const opsQ = diff === 'easy' ? ['+', '-'] : (diff === 'med' ? ['+', '-', '×'] : ['+', '-', '×', '÷']);
                        const opQ = opsQ[MathGen.rand(0, opsQ.length - 1)];
                        a = MathGen.rand(2, rangeMax); b = MathGen.rand(2, (opQ === '×' ? 12 : rangeMax));
                        if (opQ === '÷') { b = MathGen.rand(2, 10); a = b * MathGen.rand(2, 12); }
                        if (opQ === '-') { if (b > a) [a, b] = [b, a]; } 
                        q.text = `${a} ${opQ} ${b}`; q.answer = opQ === '+' ? a+b : (opQ === '-' ? a-b : (opQ === '×' ? a*b : a/b)); q.hint = "Solve basic arithmetic.";
                        break;
                    case 'missing':
                        a = MathGen.rand(2, rangeMax); b = MathGen.rand(2, rangeMax); q.answer = a;
                        if (Math.random() > 0.5) { q.text = `? + ${b} = ${a + b}`; q.hint = `Subtract ${b} from total.`; } 
                        else { let total = a + b; q.text = `${total} - ? = ${b}`; q.hint = `Subtract ${b} from ${total}.`; }
                        break;
                    case 'pattern':
                        const step = MathGen.rand(2, diff === 'easy' ? 5 : 12); const start = MathGen.rand(1, 20);
                        const isMulti = (diff === 'hard' && Math.random() > 0.5);
                        if (isMulti) { let m = MathGen.rand(2, 4); q.text = `${start}, ${start*m}, ${start*m*m}, ?`; q.answer = start*m*m*m; q.hint = `Multiply by ${m}`; } 
                        else { q.text = `${start}, ${start+step}, ${start+step*2}, ?`; q.answer = start+step*3; q.hint = `Add ${step} to previous.`; }
                        break;
                    case 'equation':
                        a = MathGen.rand(2, 10); b = MathGen.rand(2, 6); c = MathGen.rand(2, 10);
                        if (diff === 'easy') { q.text = `${a} + ${b} × 2`; q.answer = a + (b * 2); } 
                        else { const opsE = ['+', '-']; const opE = opsE[MathGen.rand(0, 1)]; q.text = `${c} ${opE} ${a} × ${b}`; q.answer = opE === '+' ? c + (a * b) : c - (a * b); }
                        q.hint = "Multiply/Divide FIRST!";
                        break;
                    case 'odd':
                        let type = MathGen.rand(1, 3); let arr = [];
                        if (type === 1) { for(let i=0; i<3; i++) arr.push(MathGen.rand(1, 20)*2); q.answer = (MathGen.rand(1, 20)*2) - 1; q.hint = "Look for odd/even."; } 
                        else if (type === 2) { for(let i=0; i<3; i++) arr.push(MathGen.rand(1, 10)*5); q.answer = (MathGen.rand(1, 10)*5) + MathGen.rand(1, 4); q.hint = "Multiples of 5."; } 
                        else { let base = MathGen.rand(20, 50); arr = [base, base+2, base+4]; q.answer = base + 15; q.hint = "Look at the gap."; }
                        arr.push(q.answer); q.options = MathGen.shuffle(arr); q.text = "Odd One Out";
                        return q;
                }
                let rangeMod = diff === 'easy' ? 4 : (diff === 'med' ? 8 : 15);
                q.options = MathGen.getDistractors(q.answer, 3, rangeMod);
                return q;
            }
        };

        function startGame() {
            state.score = 0; state.streak = 0; state.correctCount = 0;
            state.timeLeft = state.difficulty === 'hard' ? 45 : (state.difficulty === 'med' ? 60 : 75);
            state.maxTime = state.timeLeft; state.isPaused = false;
            
            document.getElementById('game-score').innerText = '0';
            document.getElementById('game-streak').innerText = '🔥 0';
            
            const modeLabels = { 'quick': 'Quick Math', 'missing': 'Missing No.', 'pattern': 'Number Pattern', 'equation': 'Equations', 'odd': 'Odd One Out', 'brain': 'Brain Test' };
            document.getElementById('game-mode-label').innerText = modeLabels[state.mode].toUpperCase();
            
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%'; bar.style.backgroundColor = '#10b981';
            
            AudioSys.init();
            nav('screen-game');
            nextQuestion();
            startTimer();
        }

        function startTimer() {
            clearInterval(state.timer);
            state.timer = setInterval(() => {
                if (state.isPaused) return;
                state.timeLeft--;
                const pct = (state.timeLeft / state.maxTime) * 100;
                const bar = document.getElementById('timer-bar');
                bar.style.width = `${pct}%`;
                if (pct < 25) bar.style.backgroundColor = '#ef4444'; else if (pct < 50) bar.style.backgroundColor = '#f59e0b'; else bar.style.backgroundColor = '#10b981';
                if (state.timeLeft <= 0) endGame("Time's Up!");
            }, 1000);
        }

        function pauseGame() { AudioSys.click(); state.isPaused = true; document.getElementById('pause-sound-btn').innerText = state.soundEnabled ? 'SOUND: ON' : 'SOUND: OFF'; nav('screen-pause'); }
        function resumeGame() { AudioSys.click(); state.isPaused = false; nav('screen-game'); }

        function showHint() {
            AudioSys.click(); const hintEl = document.getElementById('hint-text');
            if(hintEl.classList.contains('hidden') && state.score >= 5) {
                hintEl.innerText = state.currentQ.hint; hintEl.classList.remove('hidden'); state.score -= 5; document.getElementById('game-score').innerText = state.score;
            } else if (state.score < 5) { hintEl.innerText = "Need 5 points!"; hintEl.classList.remove('hidden'); }
            setTimeout(()=>hintEl.classList.add('hidden'), 3000);
        }

        function nextQuestion() {
            document.getElementById('hint-text').classList.add('hidden');
            state.currentQ = MathGen.generate(state.mode, state.difficulty);
            const qEl = document.getElementById('question-text');
            qEl.innerText = state.currentQ.text;
            if(state.currentQ.text.length > 12) qEl.style.fontSize = 'clamp(1.5rem, 6vw, 2.5rem)'; else qEl.style.fontSize = 'clamp(2.5rem, 10vw, 4rem)';
            
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';
            state.currentQ.options.forEach(opt => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
                let eventFired = false;
                const handleTap = (e) => { e.preventDefault(); if(eventFired) return; eventFired = true; handleAnswer(opt, btn); };
                btn.addEventListener('touchstart', handleTap, {passive: false});
                btn.addEventListener('mousedown', (e) => { if(!eventFired) handleTap(e); });
                optsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selected, btnEl) {
            const isCorrect = (selected === state.currentQ.answer);
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (isCorrect) {
                AudioSys.correct(); btnEl.classList.add('correct');
                let basePts = state.difficulty === 'easy' ? 10 : (state.difficulty === 'med' ? 20 : 35);
                state.score += (basePts + Math.floor(state.streak / 3) * 5); state.streak++; state.correctCount++;
                state.timeLeft = Math.min(state.maxTime, state.timeLeft + (state.difficulty === 'hard' ? 3 : (state.difficulty === 'med' ? 2 : 1)));
            } else {
                AudioSys.wrong(); btnEl.classList.add('wrong'); state.streak = 0; state.timeLeft = Math.max(0, state.timeLeft - 2);
                allBtns.forEach(b => { if (parseFloat(b.innerText) === state.currentQ.answer) { b.classList.add('correct'); b.style.transform = 'none'; } });
            }
            document.getElementById('game-score').innerText = state.score;
            document.getElementById('game-streak').innerText = `🔥 ${state.streak}`;
            setTimeout(nextQuestion, 700);
        }

        function endGame(reason = "Game Over") {
            clearInterval(state.timer); AudioSys.over();
            if (state.score > state.highScore) { state.highScore = state.score; localStorage.setItem('mathMobileHigh', state.highScore); document.getElementById('home-high-score').innerText = state.highScore; }
            document.getElementById('result-title').innerText = reason; document.getElementById('result-score').innerText = state.score;
            document.getElementById('result-correct').innerText = state.correctCount; document.getElementById('result-best').innerText = state.highScore;
            nav('screen-results');
        }
    </script>
</body>
</html>
